<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISTRA Wellness — viewpoints from the brief</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#eee}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  #top{position:absolute;left:0;right:0;top:0;z-index:3;padding:10px 12px 14px;background:linear-gradient(#000c,#0000)}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .row+.row{margin-top:8px}
  .ttl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-right:6px}
  button{background:#000a;color:#eee;border:1px solid #fff4;border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
  button.on{background:#e8e2d4;color:#111;border-color:#e8e2d4}
  .seg{display:inline-flex;border:1px solid #fff5;border-radius:8px;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:0 0 auto}
  .seg button{border:0;border-radius:0;border-right:1px solid #fff3;background:#000b;padding:7px 12px}
  .seg button:last-child{border-right:0}
  .seg button.on{background:#ff5a36;color:#fff}
  .sp{flex:1}
  #lvdesc{font-size:12px;opacity:.75;margin-left:4px}
  #hud{position:absolute;right:12px;bottom:12px;font-size:12px;background:#000a;padding:6px 10px;border-radius:6px;z-index:3;max-width:60vw}
  #help{position:absolute;right:12px;bottom:44px;font-size:11px;opacity:.7;background:#0008;padding:5px 9px;border-radius:6px;z-index:3}
  #load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;background:#000b;padding:8px 14px;border-radius:6px;z-index:4;display:none}
  #map{position:absolute;left:12px;bottom:12px;width:min(250px,42vw);z-index:3;background:#000b;border:1px solid #fff3;border-radius:8px;overflow:hidden;user-select:none}
  #map .hd{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;opacity:.85;cursor:pointer;gap:8px}
  #map svg{display:block;width:100%;height:auto}
  #map.min svg,#map.min .lg{display:none}#map .hd span{white-space:nowrap}#mapt{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pt{cursor:pointer}
  .pt circle.dot{fill:#fff;stroke:#111;stroke-width:2}
  .pt.on circle.dot{fill:#ff5a36}
  .pt text{font-size:15px;font-weight:700;fill:#111;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .pt.on text{fill:#fff}
  .ghost{fill:#0006;stroke:#ffd36a;stroke-opacity:.95;stroke-width:2;stroke-dasharray:3 2}
  .ghostl{stroke:#ffd36a;stroke-opacity:.7;stroke-width:1.4}
  #map .lg{font-size:11px;padding:5px 8px 7px;line-height:1.5;opacity:.9}
  #map .lg div{cursor:pointer}
  #map .lg div.on{color:#ff8a6a}
  #map .lg .note{opacity:.6;cursor:default;margin-top:3px}
  @media (max-width:700px){#map .lg{display:none}#hud{max-width:calc(58vw - 44px);font-size:11px}#btns{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#btns::-webkit-scrollbar{display:none}#btns button{flex:0 0 auto}#top .row:first-child .sp{display:none}#help{display:none}.ttl{display:none}#lvdesc{display:none}button{padding:6px 8px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="row"><span class="ttl">ISTRA Wellness</span><span class="seg" id="levels"></span><span id="lvdesc"></span><span class="sp"></span>
    <button id="hd" title="Load 16K (heavy, ~6–12 MB per view)" style="display:none">HD 16K</button><button id="fs" title="Fullscreen">⛶ Fullscreen</button></div>
  <div class="row" id="btns"></div>
</div>
<div id="load">Loading panorama…</div>
<div id="map">
  <div class="hd" id="maphd"><span>Masterplan · N ↑</span><span id="mapt">–</span></div>
  <svg id="svg" viewBox="0 0 481 580">
    <image href="minimap.png" x="0" y="0" width="481" height="580"/>
    <g id="ghosts"></g>
    <g id="cone"></g>
    <g id="pts"></g>
  </svg>
  <div class="lg" id="lg"></div>
</div>
<div id="help">Drag to look around · Scroll / pinch to zoom · Keys 1–5 switch levels, [ ] switch views · R resets</div>
<div id="hud"></div>
<script>
// map pixel = affine(model metres); fitted on the four brief points
const MAP=([x,y])=>[0.18303*x+0.00017*y+260.524,-0.00009*x-0.18437*y+335.783];
const BRIEF_XY={1:[-178.2,1127.0],2:[-260.7,338.1],3:[291.7,264.5],4:[-75.6,-627.7]};
const R16=['_2k.jpg','_8k.jpg','_16k.jpg'],R8=['_2k.jpg','_8k.jpg'],R4=['_2k.jpg','_4k.jpg'];
const PROP=[
 {k:'1a',n:1,t:'1A · Cottage, ~20 m',d:'Viewpoint 1A — next to the cottage, ~20 m from the facade',xy:[-396,1040],h:268},
 {k:'1b',n:1,t:'1B · Cottage, ~35 m',d:'Viewpoint 1B — ~35 m from the cottage',xy:[-380,1046],h:268},
 {k:'2',n:2,t:'2 · Marina',d:'Viewpoint 2 — marina basin, from a boat',xy:[-260.7,338.1],h:250},
 {k:'3a',n:3,t:'3A · Pool, ~8 m',d:'Viewpoint 3A — bionic hotel, ~8 m from the pool',xy:[468,272],h:198},
 {k:'3b',n:3,t:'3B · Pool, ~22 m',d:'Viewpoint 3B — bionic hotel, ~22 m from the pool',xy:[478,285],h:198},

const RSRC={'1a':'ref/R1a','1b':'ref/R1b','2':'ref/R2','3a':'ref/R3a','3b':'ref/R3b','4':'ref/R4'};
const L=[
 {id:'brief',name:'1 · Original brief',desc:'Exact points from the brief · grey model, real water',items:[
  {k:'1',n:1,t:'1 · Lake shore',d:'Viewpoint 1 — on the water by the pier',src:'pano/P1',res:R16,xy:BRIEF_XY[1],h:268},
  {k:'2',n:2,t:'2 · Marina',d:'Viewpoint 2 — marina basin, from a boat',src:'pano/P2',res:R16,xy:BRIEF_XY[2],h:250},

 {id:'reference',name:'3 · Reference previews',desc:'AI reference previews from the proposed cameras · mood only',items:PROP.map(p=>({...p,d:p.d+' · reference preview',src:RSRC[p.k],res:R4}))},
 {id:'preview',name:'4 · Panorama previews',desc:'Work-in-progress panorama previews · materials, planting, light',items:[
  {k:'1',n:1,t:'1 · Cottage & wellness hotel',d:'Panorama preview 1 — cottage and wellness hotel',src:'wip/W1',res:['_2k.jpg','_8k.jpg'],xy:[-380,1046],h:268}]}];
const ALT_ITEMS=[
 {k:'1a',n:1,t:'1A · Villas, 6 m',d:'Alt 1A — closer to the hotel, eye height 6 m',src:'alt/ALT_V1',xy:[-405,1080],h:260},
 {k:'1b',n:1,t:'1B · Villas, 12 m',d:'Alt 1B — closer to the hotel, eye height 12 m',src:'alt/ALT_V2',xy:[-405,1080],h:260},
 {k:'1c',n:1,t:'1C · Villas, 20 m overview',d:'Alt 1C — overview of villas and hotel, 20 m',src:'alt/ALT_V3',xy:[-385,1095],h:265},
 {k:'2a',n:2,t:'2A · Yacht deck',d:'Alt 2A — upper deck of a 23 m yacht, eye ~8.5 m',src:'alt/ALT_M1',xy:[-260.7,338.1],h:250},
 {k:'2b',n:2,t:'2B · Yacht deck, basin corner',d:'Alt 2B — yacht upper deck in the basin corner, looking across the marina',src:'alt/ALT_M2',xy:[-231.5,368.5],h:235},
 {k:'2c',n:2,t:'2C · Elevated 15 m',d:'Alt 2C — 15 m above the water, overview of the marina',src:'alt/ALT_M3',xy:[-260.7,338.1],h:250},
 {k:'3a',n:3,t:'3A · Pool walkway',d:'Alt 3A — on the walkway crossing the pool',src:'alt/ALT_H1',xy:[482,240],h:215},
 {k:'3b',n:3,t:'3B · In the pool',d:'Alt 3B — in the pool, 1.5 m above the water',src:'alt/ALT_H2',xy:[470,222],h:210},
 {k:'3c',n:3,t:'3C · Walkway, water level',d:'Alt 3C — walkway at water level',src:'alt/ALT_H3',xy:[482,240],h:215},
 {k:'1d',n:1,t:'1D · Villas, 34 m overview',d:'Alt 1D — 34 m above the ground between the cottage and the hotel, overall structure',src:'alt/ALT_V7',xy:[-410,1060],h:280},
 {k:'1e',n:1,t:'1E · Villas, past the cottage, 8 m',d:'Alt 1E — south-east of the cottage, looking along it to the hotel, 8 m',src:'alt/ALT_V5',xy:[-372,996],h:320},
 {k:'1f',n:1,t:'1F · In front of the hotel, 6 m',d:'Alt 1F — in front of the hotel facade, cottage to the side, 6 m',src:'alt/ALT_V8',xy:[-415,1110],h:250},
 {k:'2d',n:2,t:'2D · Yacht deck, east corner',d:'Alt 2D — yacht upper deck in the east corner of the basin',src:'alt/ALT_M4',xy:[-205,318],h:280},
 {k:'2e',n:2,t:'2E · Yacht deck, south corner',d:'Alt 2E — yacht upper deck in the south corner of the basin',src:'alt/ALT_M5',xy:[-250,265],h:320},
 {k:'2f',n:2,t:'2F · Elevated 25 m',d:'Alt 2F — 25 m above the basin centre, marina overview',src:'alt/ALT_M6',xy:[-269,333],h:250},
 {k:'3d',n:3,t:'3D · In the pool, near hotel',d:'Alt 3D — in the pool closer to the hotel, 1.5 m above the water',src:'alt/ALT_H4',xy:[462,212],h:205},
 {k:'3e',n:3,t:'3E · Elevated 12 m over pool',d:'Alt 3E — 12 m above the north edge of the pool',src:'alt/ALT_H5',xy:[482,262],h:205},
 {k:'3f',n:3,t:'3F · In the pool, side view',d:'Alt 3F — in the pool, side angle to the hotel',src:'alt/ALT_H6',xy:[500,225],h:240}].sort((a,b)=>a.k.localeCompare(b.k));
L.push({id:'alternatives',name:'5 · Camera alternatives',desc:'Alternative camera positions for review · grey model, real water',items:ALT_ITEMS.map(x=>({...x,res:['_2k.jpg','_8k.jpg']}))});
const MAXT0=(()=>{try{const g=document.createElement('canvas').getContext('webgl');return g?g.getParameter(g.MAX_TEXTURE_SIZE):4096}catch(e){return 4096}})();
const MOBILE=matchMedia('(max-width:900px)').matches||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
L.forEach(l=>l.items.forEach(it=>{[it.x,it.y]=MAP(it.xy);it.res=MOBILE?['_1k.jpg','_4k.jpg'].concat(it.res.includes('_8k.jpg')&&MAXT0>=8192?['_8k.jpg']:[]):['_1k.jpg',...it.res]}));

// ---------- WebGL panorama
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:false});
const vs='attribute vec2 p;varying vec2 q;void main(){q=p;gl_Position=vec4(p,0.,1.);}';
const fs='precision highp float;varying vec2 q;uniform sampler2D t;uniform float yaw,pitch,f,asp;void main(){vec3 d=normalize(vec3(q.x*asp*f,q.y*f,1.));float cp=cos(pitch),sp=sin(pitch);d=vec3(d.x,d.y*cp+d.z*sp,-d.y*sp+d.z*cp);float cy=cos(yaw),sy=sin(yaw);d=vec3(d.x*cy+d.z*sy,d.y,-d.x*sy+d.z*cy);float u=atan(d.x,d.z)/6.2831853+.5;float v=.5-asin(clamp(d.y,-1.,1.))/3.14159265;gl_FragColor=texture2D(t,vec2(u,v));}';
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);const ANI=gl.getExtension('EXT_texture_filter_anisotropic')||gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');const ANIMAX=ANI?Math.min(16,gl.getParameter(ANI.MAX_TEXTURE_MAX_ANISOTROPY_EXT)):1;const MAXT=gl.getParameter(gl.MAX_TEXTURE_SIZE);
const CAN16=MAXT>=16384&&!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
let yaw=0,pitch=0,fov=95,lv=0,cur=null,hd=false;const T={},pending={};
const ld=document.getElementById('load');
const RN=r=>({'_1k.jpg':'1K preview','_2k.jpg':'2K','_4k.jpg':'4K','_8k.jpg':'8K','_16k.jpg':'16K'})[r];
function fetchImg(url){return new Promise((res,rej)=>{const im=new Image();im.decoding='async';im.onload=()=>{(im.decode?im.decode():Promise.resolve()).then(()=>res(im),()=>res(im))};im.onerror=rej;im.src=url})}
function upload(it,im,l){let s=im;if(im.width>MAXT){const c=document.createElement('canvas');c.width=MAXT;c.height=MAXT/2;c.getContext('2d').drawImage(im,0,0,MAXT,MAXT/2);s=c}
 const e=T[it.src]||(T[it.src]={t:gl.createTexture(),l:-1});gl.bindTexture(gl.TEXTURE_2D,e.t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,s);
 const pot=v=>(v&(v-1))==0;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 if(pot(s.width)&&pot(s.height)){gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);if(ANI)gl.texParameterf(gl.TEXTURE_2D,ANI.TEXTURE_MAX_ANISOTROPY_EXT,ANIMAX)}else gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 e.l=l;if(it===cur)draw()}
const lvlOf=it=>(T[it.src]?T[it.src].l:-1);
function want(it,l){if(l>=it.res.length||lvlOf(it)>=l)return Promise.resolve();const k=it.src+'|'+l;if(pending[k])return pending[k];
 pending[k]=fetchImg(it.src+it.res[l]).then(im=>{if(lvlOf(it)<l)upload(it,im,l)}).catch(()=>{}).finally(()=>{delete pending[k];if(it===cur)draw()});if(it===cur)draw();return pending[k]}
const busy=()=>cur&&Object.keys(pending).some(k=>k.startsWith(cur.src+'|'));
const topRes=it=>{const i=it.res.indexOf('_16k.jpg');return i<0?it.res.length-1:(hd?i:i-1)};
function prefetch(){if(MOBILE)return;L[lv].items.forEach(it=>{if(it!==cur)want(it,0)})}

// ---------- UI
const NS='http://www.w3.org/2000/svg',levels=document.getElementById('levels'),btns=document.getElementById('btns'),pts=document.getElementById('pts'),lg=document.getElementById('lg'),ghosts=document.getElementById('ghosts');
const SHORT=['1 · Brief','2 · Cameras','3 · References','4 · Previews','5 · Alternatives'];const narrow=matchMedia('(max-width:700px)');
L.forEach((l,i)=>{const b=document.createElement('button');b.textContent=narrow.matches?SHORT[i]:l.name;b.onclick=()=>go(i,cur?cur.k:null);levels.appendChild(b)});
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function buildLevel(){const l=L[lv];[...levels.children].forEach((b,i)=>b.classList.toggle('on',i==lv));document.getElementById('lvdesc').textContent=l.desc;
 btns.innerHTML='';lg.innerHTML='';pts.innerHTML='';ghosts.innerHTML='';
 l.items.forEach(it=>{const b=document.createElement('button');b.textContent=it.t;b.onclick=()=>go(lv,it.k);b.dataset.k=it.k;btns.appendChild(b);
  const d=document.createElement('div');d.textContent=it.t;d.dataset.k=it.k;d.onclick=()=>go(lv,it.k);lg.appendChild(d)});
 if(lv>0){[1,2,3,4].forEach(n=>{const [bx,by]=MAP(BRIEF_XY[n]);const it=l.items.find(i=>i.n==n);if(!it)return;
   el('line',{x1:bx,y1:by,x2:it.x,y2:it.y,class:'ghostl'},ghosts);el('circle',{cx:bx,cy:by,r:7,class:'ghost'},ghosts)});
  const nt=document.createElement('div');nt.className='note';nt.textContent='Yellow dashed circles: original brief points';lg.appendChild(nt)}
 const nums=[...new Set(l.items.map(i=>i.n))];nums.forEach(n=>{const g=el('g',{class:'pt'},pts);g.dataset.n=n;el('circle',{r:22,fill:'transparent'},g);el('circle',{class:'dot',r:12},g);const tx=el('text',{},g);tx.textContent=n;
  g.addEventListener('click',e=>{e.stopPropagation();const same=cur&&cur.n==n&&L[lv].items.includes(cur);const vs_=l.items.filter(i=>i.n==n);
   const nx=same?vs_[(vs_.indexOf(cur)+1)%vs_.length]:vs_[0];go(lv,nx.k)})});}
function placeMarkers(){const l=L[lv];[...pts.children].forEach(g=>{const n=+g.dataset.n;const it=(cur&&cur.n==n)?cur:l.items.find(i=>i.n==n);g.setAttribute('transform',`translate(${it.x},${it.y})`);g.classList.toggle('on',!!cur&&cur.n==n)});
 [...btns.children,...lg.children].forEach(b=>b.classList&&b.classList.toggle('on',!!cur&&b.dataset.k===cur.k))}
document.getElementById('maphd').onclick=()=>document.getElementById('map').classList.toggle('min');
function go(i,k){const l=L[i];const it=l.items.find(x=>x.k===k)||l.items.find(x=>k&&x.n==parseInt(k))||l.items[0];const h='#'+l.id+'-'+it.k;if(location.hash!==h)location.hash=h;else show(i,it)}
function show(i,it){if(lv!==i||!pts.children.length){lv=i;buildLevel()}if(MOBILE)for(const k in T)if(k!==it.src&&T[k].l>0){gl.deleteTexture(T[k].t);delete T[k]}cur=it;yaw=0;pitch=0;fov=95;placeMarkers();
 document.getElementById('mapt').textContent=it.t.split('·')[1].trim();ld.style.display=lvlOf(it)>=0?'none':'block';
 want(it,0).then(()=>{if(cur===it){ld.style.display='none';draw()}const top=topRes(it);let p=Promise.resolve();for(let r=1;r<=top;r++)p=p.then(()=>cur===it?want(it,r):null);return p}).then(prefetch)}
function fromHash(){const m=location.hash.slice(1).match(/^(brief|proposal|reference|preview|alternatives)-(\w+)$/);if(!m){show(0,L[0].items[0]);return}
 const i=L.findIndex(l=>l.id===m[1]);const it=L[i].items.find(x=>x.k===m[2])||L[i].items[0];show(i,it)}
addEventListener('hashchange',fromHash);
const dirs=['N','NE','E','SE','S','SW','W','NW'];
function cone(az,fovDeg){const R=70,a=fovDeg/2*Math.PI/180;const x1=Math.sin(-a)*R,y1=-Math.cos(-a)*R,x2=Math.sin(a)*R,y2=-Math.cos(a)*R;
 document.getElementById('cone').innerHTML=`<g transform="translate(${cur.x},${cur.y}) rotate(${az})"><defs><radialGradient id="cg" cx="0" cy="0" r="${R}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a36" stop-opacity=".85"/><stop offset="1" stop-color="#ff5a36" stop-opacity="0"/></radialGradient></defs><path d="M0 0 L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z" fill="url(#cg)"/></g>`}
function draw(){if(!cur||!T[cur.src])return;const w=cv.clientWidth*devicePixelRatio|0,h=cv.clientHeight*devicePixelRatio|0;if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h}gl.viewport(0,0,w,h);
 gl.bindTexture(gl.TEXTURE_2D,T[cur.src].t);gl.uniform1f(U('yaw'),yaw);gl.uniform1f(U('pitch'),pitch);gl.uniform1f(U('f'),Math.tan(fov*Math.PI/360));gl.uniform1f(U('asp'),w/h);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 const az=((cur.h+yaw*180/Math.PI)%360+360)%360;const hf=2*Math.atan(Math.tan(fov*Math.PI/360)*w/h)*180/Math.PI;cone(az,Math.min(hf,170));
 document.getElementById('hud').textContent=cur.d+' · facing '+dirs[Math.round(az/45)%8]+' ('+az.toFixed(0)+'°) · '+RN(cur.res[T[cur.src].l])+(busy()?' · sharpening…':'')}
// pointer: drag to look, pinch to zoom
const ptrs=new Map();let drag=null,pinch=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size==1)drag=[e.clientX,e.clientY,yaw,pitch];else if(ptrs.size==2){const v=[...ptrs.values()];pinch=[Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),fov];drag=null}};
cv.onpointerup=cv.onpointercancel=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size==1){const v=[...ptrs.values()][0];drag=[v[0],v[1],yaw,pitch]}else if(!ptrs.size)drag=null};
cv.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&ptrs.size==2){const v=[...ptrs.values()];const d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);fov=Math.max(30,Math.min(120,pinch[1]*pinch[0]/d));draw();return}
 if(!drag)return;const k=fov*Math.PI/180/cv.clientHeight;yaw=drag[2]-(e.clientX-drag[0])*k;pitch=Math.max(-1.55,Math.min(1.55,drag[3]+(e.clientY-drag[1])*k));draw()};
cv.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(30,Math.min(120,fov+e.deltaY*0.05));draw()},{passive:false});
addEventListener('keydown',e=>{const it=L[lv].items,i=it.indexOf(cur);if(e.key=='ArrowRight'&&e.shiftKey||e.key=='PageDown'||e.key==']')go(lv,it[(i+1)%it.length].k);
 if(e.key=='ArrowLeft'&&e.shiftKey||e.key=='PageUp'||e.key=='[')go(lv,it[(i-1+it.length)%it.length].k);
 if(!e.shiftKey&&e.key=='ArrowLeft'){yaw-=.1;draw()}if(!e.shiftKey&&e.key=='ArrowRight'){yaw+=.1;draw()}
 if(e.key>='1'&&e.key<='5')go(+e.key-1,cur?cur.k:null);if(e.key.toLowerCase()=='r'){yaw=0;pitch=0;fov=95;draw()}});
const hb=document.getElementById('hd');if(CAN16)hb.style.display='';
hb.onclick=()=>{hd=!hd;hb.classList.toggle('on',hd);if(hd&&cur&&cur.res.includes('_16k.jpg'))want(cur,cur.res.length-1)};
document.getElementById('fs').onclick=()=>{try{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen()).catch(()=>{})}catch(e){}};
narrow.addEventListener&&narrow.addEventListener('change',()=>[...levels.children].forEach((b,i)=>b.textContent=narrow.matches?SHORT[i]:L[i].name));
addEventListener('resize',draw);fromHash();
</script>
